name: TourTicket release gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tourticket-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Type, lint, unit, API, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      CI: "true"
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: "1"
      MONGODB_URI: mongodb://127.0.0.1:27017/tourticket_ci
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
      REVENUEPILOT_PRICING_API_ENABLED: "false"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build:skip-tests
      - name: API integration tests against the production server
        shell: bash
        run: |
          pnpm start > /tmp/tourticket-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/tourticket-server.log
            exit 1
          fi
          TEST_BASE_URL=http://127.0.0.1:3000 pnpm test:api
      - run: pnpm audit --prod
      - name: Generate dependency and license evidence
        run: |
          mkdir -p security-artifacts
          pnpm list --prod --depth Infinity --json > security-artifacts/tourticket-dependency-tree.json
          pnpm licenses list --prod --json > security-artifacts/tourticket-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: tourticket-supply-chain
          path: security-artifacts/
          retention-days: 30

  source-integrity:
    name: Source integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject whitespace errors and committed secrets
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          if git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN|sk_(live|test)_[A-Za-z0-9]{16,}|rk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|(postgres|postgresql|mongodb(\+srv)?)://[^[:space:]/]+:[^[:space:]@]+@|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,})' -- . ':!pnpm-lock.yaml'; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi
